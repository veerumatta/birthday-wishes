<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Realistic Background Image with a dark overlay for text contrast */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }

        /* Glassmorphism Card Effect */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
            width: 85%;
            animation: zoomIn 1.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #fff;
            font-family: 'Dancing Script', cursive; /* Handwritten style */
            font-size: 52px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            color: #ffdde1;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            font-size: 20px;
            color: #fff;
            line-height: 1.6;
            font-style: italic;
            min-height: 80px; /* Keeps card size stable */
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        button {
            margin-top: 30px;
            padding: 15px 35px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            background: linear-gradient(45deg, #ff4757, #ff6b81);
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 5s linear forwards;
            opacity: 0;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday</h1>
        <h2 id="name">My Angel ❤️</h2>
        <p id="message">
            To the girl who makes my world brighter just by being in it. <br>Happy Birthday, beautiful. ✨
        </p>
        <button onclick="changeWish()">Tap for Love 💌</button>
    </div>

    <script>
        const wishes = [
            "Every day with you is a gift, but today is extra special. Happy Birthday! 💖",
            "You are the reason my reality is finally better than my dreams. 🦋",
            "Wishing the happiest birthday to the girl who stole my heart. 🔒❤️",
            "Your smile is my favorite thing in the entire world. Keep shining! ✨",
            "I didn't know what love was until I met you. Enjoy your day! 🌹",
            "You are not just a year older, but a year more beautiful. 😍"
        ];

        function changeWish() {
            // Text Animation
            const msgElement = document.getElementById("message");
            msgElement.style.opacity = 0;
            
            setTimeout(() => {
                const random = Math.floor(Math.random() * wishes.length);
                msgElement.innerHTML = wishes[random];
                msgElement.style.opacity = 1;
                msgElement.style.transition = "opacity 0.5s";
            }, 300);

            // Create Heart Shower
            for(let i=0; i<15; i++) {
                setTimeout(createHeart, i * 200); // Stagger the hearts
            }
        }

        function createHeart() {
            const heart = document.createElement("div");
            const icons = ["❤️", "💖", "✨", "🦋", "🌸"];
            heart.className = "heart";
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // Randomize position and speed
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 3) + "s"; 
            heart.style.fontSize = (Math.random() * 20 + 20) + "px";
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
    </script>

</body>
</html>
